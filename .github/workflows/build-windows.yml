name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ensure Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # Тесты (включая матрицу 1280×720…4K × 100/150/200 % × темы) → Grasp.exe →
      # smoke-test сборки → GraspSetup.exe → portable zip
      - name: Build (tests → exe → installer → zip)
        env:
          PYTHONIOENCODING: utf-8
        run: python build.py

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screens
          path: build/ui-screens
          if-no-files-found: ignore

      # «Чистая» проверка: тихая установка, запуск установленного Grasp.exe
      # без Python в PATH, проверка записи в «Приложения и возможности»,
      # удаление.
      - name: Install → run without Python → uninstall
        run: |
          $setup = Get-ChildItem dist\GraspSetup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon' -Wait
          $app = "${env:ProgramFiles}\Grasp\Grasp.exe"
          if (-not (Test-Path $app)) { throw "Grasp.exe не установлен" }
          $info = (Get-Item $app).VersionInfo
          Write-Host "Версия файла: $($info.FileVersion); продукт: $($info.ProductName); издатель: $($info.CompanyName)"
          $key = Get-ChildItem 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
            Where-Object { $_.GetValue('DisplayName') -eq 'Grasp' }
          if (-not $key) { throw "Нет пункта удаления в «Приложения и возможности»" }

          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Python' }) -join ';'
          $env:PYTHONHOME = ''; $env:PYTHONPATH = ''
          $out = "$env:RUNNER_TEMP\installed-smoke.json"
          Start-Process $app -ArgumentList '--smoke-test','--smoke-out',$out -Wait
          Get-Content $out
          $r = Get-Content $out | ConvertFrom-Json
          if (-not $r.ok) { throw "smoke-test установленной версии не пройден" }
          if (-not ($r.data_dir -like "*AppData\Roaming\Grasp")) { throw "Данные не в %APPDATA%\Grasp: $($r.data_dir)" }

          $unins = "${env:ProgramFiles}\Grasp\unins000.exe"
          Start-Process $unins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $app) { throw "Удаление не сработало" }
          Write-Host "Установка, запуск и удаление — OK"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: grasp-windows
          path: |
            dist/GraspSetup-*.exe
            dist/Grasp-*-portable-win64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GraspSetup-*.exe
            dist/Grasp-*-portable-win64.zip
