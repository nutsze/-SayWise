# Только для разработчика (новые миграции):
#   alembic revision --autogenerate -m "описание"
# Приложение само прогоняет миграции при старте и этот файл не читает.
[alembic]
script_location = grasp/data/migrations
prepend_sys_path = .
# sqlalchemy.url не задан: env.py возьмёт БД из %APPDATA%\Grasp\grasp.db
# (или из GRASP_DATA_DIR).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
